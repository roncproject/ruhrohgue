name: CI/CD — RuhRohgue Cloud Edition (Test Only)

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  # ── Phase 1: Test ────────────────────────────────────────────────────
  # This is the only phase left. It ensures your code fixes are clean and validated.
  test:
    name: Run Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: corretto
          java-version: '17'
          cache: maven

      - name: Run tests
        run: mvn test -B
