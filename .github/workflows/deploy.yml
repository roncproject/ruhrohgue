name: CI/CD — RuhRohgue Cloud Edition

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  # ── Phase 1: Test ────────────────────────────────────────────────────
  test:
    name: Run Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: corretto
          java-version: '17'
          cache: maven

      - name: Run tests
        run: mvn test -B

  # ── Phase 2: Build ───────────────────────────────────────────────────
  build:
    name: Build JAR
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: corretto
          java-version: '17'
          cache: maven

      - name: Build fat JAR
        run: mvn clean package -DskipTests -B

      - name: Upload JAR artifact
        uses: actions/upload-artifact@v4
        with:
          name: ruhrohgue-jar
          path: target/ruhrohgue.jar

  # ── Phase 3: Deploy to Elastic Beanstalk ─────────────────────────────
  deploy:
    name: Deploy to AWS Elastic Beanstalk
    needs: build
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Download JAR artifact
        uses: actions/download-artifact@v4
        with:
          name: ruhrohgue-jar
          path: target/

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id:     ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region:            ${{ secrets.AWS_REGION }}

      - name: Create EB deployment bundle
        run: |
          cp target/ruhrohgue.jar .
          zip -r ruhrohgue-deploy.zip ruhrohgue.jar Procfile .ebextensions/

      - name: Upload bundle to S3
        run: |
          aws s3 cp ruhrohgue-deploy.zip \
            s3://${{ secrets.AWS_EB_BUCKET }}/ruhrohgue-deploy-${{ github.sha }}.zip

      - name: Create Elastic Beanstalk application version
        run: |
          aws elasticbeanstalk create-application-version \
            --application-name "${{ secrets.AWS_EB_APP_NAME }}" \
            --version-label    "hack-${{ github.sha }}" \
            --source-bundle \
              "S3Bucket=${{ secrets.AWS_EB_BUCKET }},S3Key=ruhrohgue-deploy-${{ github.sha }}.zip" \
            --no-auto-create-application

      - name: Deploy to Elastic Beanstalk environment
        run: |
          aws elasticbeanstalk update-environment \
            --environment-name "${{ secrets.AWS_EB_ENV_NAME }}" \
            --version-label    "hack-${{ github.sha }}"

      - name: Wait for deployment
        run: |
          aws elasticbeanstalk wait environment-updated \
            --environment-name "${{ secrets.AWS_EB_ENV_NAME }}"
