# ─────────────────────────────────────────────────────────────────────────────
# RuhRohgue — Cloud Edition  |  application.properties
#
# LOCAL DEVELOPMENT  →  http://localhost:8080  (Spring Boot default)
# AWS ELASTIC BEANSTALK → EB injects $PORT; Procfile passes --server.port=5000
#
# Port resolution order (highest priority wins):
#   1. Command-line arg:  --server.port=NNNN
#   2. Environment var:   SERVER_PORT=NNNN  or  PORT=NNNN  (EB injects PORT)
#   3. This file:         server.port=8080  (local dev default)
#
# So locally: java -jar ruhrohgue.jar  →  port 8080  ✓
#    On EB:   Procfile adds --server.port=5000       ✓
# ─────────────────────────────────────────────────────────────────────────────

spring.application.name=ruhrohgue

# ── Thymeleaf (SSR for the landing shell)
spring.thymeleaf.prefix=classpath:/templates/
spring.thymeleaf.suffix=.html
spring.thymeleaf.mode=HTML
spring.thymeleaf.encoding=UTF-8
spring.thymeleaf.cache=true

# Default port for local development — use standard 8080 so no extra flags needed.
# Elastic Beanstalk overrides this via Procfile (--server.port=5000) or $PORT env-var.
server.port=8080

# Static resources served from classpath:/static/ (Spring Boot default location)
spring.web.resources.static-locations=classpath:/static/

# HTTP session timeout
server.servlet.session.timeout=4h

# Actuator: /actuator/health for AWS ALB health checks
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=never

# Logging
# To get more detail, run with: java -jar ruhrohgue.jar --logging.level.hack=DEBUG
# Or for full Spring trace: java -jar ruhrohgue.jar --logging.level.root=DEBUG
logging.level.root=WARN
logging.level.hack=INFO

# Uncomment below to enable detailed game engine logging without restart:
#logging.level.hack=DEBUG
#logging.level.org.springframework.web=DEBUG

# ── Magnificent 7 high score list ───────────────────────────────────────
# Default location: <system-temp-dir>/hack-scores.json
# To change the path so you can edit it easily, set the JVM property:
#   java -jar ruhrohgue.jar -Dhack.scores.file=C:/dev/project/webhack/scores.json
# The file is plain JSON-Lines (one JSON object per line) and can be
# opened and edited with any text editor.  To clear all scores, set
# ADMIN_TOKEN and send it back as a header:
#   curl -X DELETE -H "X-Admin-Token: $ADMIN_TOKEN" http://localhost:8080/dev/scores
#
# On Windows the default path is usually:
#   C:\Users\<username>\AppData\Local\Temp\hack-scores.json
# On Linux/macOS: /tmp/hack-scores.json

# ─────────────────────────────────────────────────────────────────────────────
# Admin routes
# ─────────────────────────────────────────────────────────────────────────────
# Shared secret required by DELETE /dev/scores (header X-Admin-Token). Unset
# by default, which locks the route out entirely — an empty configured token
# is never treated as a match. Set ADMIN_TOKEN in the environment to enable it.
ruhrohgue.admin.token=${ADMIN_TOKEN:}

# ─────────────────────────────────────────────────────────────────────────────
# Player records — storage
# ─────────────────────────────────────────────────────────────────────────────
# Elastic Beanstalk containers are ephemeral: anything written inside the
# container is destroyed on scale-in, scale-out and every deployment, and two
# instances behind the load balancer keep two divergent tables.
#
#   store=file  + dir=<EFS mount>   durable, shared across instances
#   store=s3    + s3.bucket=<name>  durable, no volume to mount
#   store=file  + dir=<tmpdir>      DEVELOPMENT ONLY — wiped on redeploy
#
ruhrohgue.scores.store=${SCORES_STORE:file}
ruhrohgue.scores.dir=${SCORES_DIR:${java.io.tmpdir}}
ruhrohgue.scores.file=${SCORES_FILE:ruhrohgue-scores.json}
ruhrohgue.scores.s3.bucket=${SCORES_S3_BUCKET:}
ruhrohgue.scores.s3.key=${SCORES_S3_KEY:ruhrohgue/scores.json}
ruhrohgue.scores.s3.region=${SCORES_S3_REGION:}

# ─────────────────────────────────────────────────────────────────────────────
# Denial-of-service limits
# ─────────────────────────────────────────────────────────────────────────────
# Every keypress is a POST, so an unthrottled client can saturate the servlet
# thread pool and the score store with nothing more sophisticated than a loop.
# Capacity raised from 120 to 600 requests per minute.
#
# Every keypress is a POST /command, so 120/min is only 2 requests per second.
# A player holding a movement key, or simply moving briskly, exceeded that
# within seconds and started receiving HTTP 429 — which the client retried or
# dropped, and which felt exactly like input lag. 600/min is 10 requests per
# second: comfortably above a human roguelike movement loop, still far below
# what a scripted flood would need to be effective.
#
# The values are injected into RateLimitFilter at runtime through
# @Value("${ruhrohgue.ratelimit.capacity:120}") and
# @Value("${ruhrohgue.ratelimit.window-seconds:60}"), so they can also be
# overridden per environment with RATELIMIT_CAPACITY / RATELIMIT_WINDOW
# without rebuilding.
ruhrohgue.ratelimit.enabled=${RATELIMIT_ENABLED:true}
ruhrohgue.ratelimit.capacity=${RATELIMIT_CAPACITY:600}
ruhrohgue.ratelimit.window-seconds=${RATELIMIT_WINDOW:60}

# Bound request size. The game posts a handful of form fields; nothing
# legitimate approaches these limits, so they cost nothing and close off
# memory-exhaustion by oversized payload.
server.max-http-request-header-size=16KB
server.tomcat.max-swallow-size=64KB
server.tomcat.max-http-form-post-size=64KB
spring.servlet.multipart.enabled=false

# Do not leak stack traces or internal paths to the browser on error.
server.error.include-message=never
server.error.include-stacktrace=never
server.error.include-exception=false
server.error.include-binding-errors=never
